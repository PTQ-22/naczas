# Render Blueprint: API + web app (https://render.com/docs/blueprint-spec).
# Render injects PORT itself; CORS_ORIGINS is set in the dashboard once the Vercel URL is known.
services:
  - type: web
    name: naczas-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # Render's proxy sets X-Forwarded-For
        value: 'true'
      - key: REFRESH_ON_START
        value: 'true'
      - key: RATE_LIMIT_PER_MIN
        value: '60'
      # The web app below; adjust if Render gives naczas-web a different URL.
      - key: CORS_ORIGINS
        value: https://naczas-web.onrender.com
      # "Zadzwoń za mnie": public demo = scripted call + transcript, never a real phone call.
      # To test a real call set the Vapi keys and flip CALL_ASSIST_MODE to live, then back.
      - key: CALL_ASSIST_MODE
        value: simulated
      - key: CALL_ASSIST_DAILY_LIMIT
        value: '20'
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: DEMO_CALL_TO # the ONLY number the agent dials, +48XXXXXXXXX
        sync: false
      - key: PUBLIC_URL # this service's https URL — live call transcript webhook
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      # Optional family login / cloud sync (Neon); without it only /v1/auth and /v1/sync fail
      - key: DATABASE_URL
        sync: false

  # Web build of the Expo app (the link for the jury). Static site: free and never sleeps.
  - type: web
    name: naczas-web
    runtime: static
    # Render provides pnpm itself (version from packageManager); global npm installs are read-only.
    buildCommand: pnpm install --frozen-lockfile && pnpm build:web
    staticPublishPath: ./apps/mobile/dist
    autoDeploy: true
    # Deep links like /plan must load the SPA; existing files (JS, fonts) are served as-is.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '24'
      # EXPO_PUBLIC_* is inlined at build time — change it, then redeploy.
      - key: EXPO_PUBLIC_API_URL
        value: https://naczas-api.onrender.com
      - key: EXPO_PUBLIC_USE_MOCKS
        value: '0'
